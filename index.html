<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Project 1</title>
        <!-- Links the stylesheet containing our animation and appearance rules -->
        <link rel="Stylesheet" href="index.css">
    </head>
    <!-- 
      height: 100vh  -> Take up 100% of the viewport height
      margin: 0      -> Remove default browser margin
      overflow: hidden -> Prevent scrollbars from appearing as words fall downward
    -->
    <body style="background-color: darkslategrey; height: 100vh; margin: 0; overflow: hidden;">
        <!-- Loads and executes project.js -->
        <script src="project.js"></script>
    </body>
</html>
